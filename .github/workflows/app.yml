name: Gerar app (EXE)
on:
  push:
    paths: ["app/**", "extensao/**", ".github/workflows/app.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar PainelQualidade.exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name PainelQualidade --icon app/icone.ico app/painel_app.py
      - name: Montar ZIP (alternativa sem EXE)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force zipdir | Out-Null
          Copy-Item app/painel_app.py, app/INICIAR.bat, app/LEIA-ME.txt zipdir/
          Compress-Archive -Path zipdir/* -DestinationPath PainelQualidade.zip -Force
          Compress-Archive -Path extensao -DestinationPath PainelQualidade-extensao.zip -Force
      - name: Publicar em "app-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete app-latest -y --cleanup-tag || true
          gh release create app-latest dist/PainelQualidade.exe PainelQualidade.zip PainelQualidade-extensao.zip --title "Painel Qualidade (app)" --notes "Baixe o PainelQualidade.exe e abra. Alternativa: PainelQualidade.zip (precisa de Python; o INICIAR.bat baixa sozinho se faltar)."
